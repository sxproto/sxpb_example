[project]
name = "sxpb_example"
version = "0.0.0"
authors = [
]
dependencies = [
]
requires-python = ">=3.9"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest",
    "sxpb @ git+https://github.com/sxproto/sxpb-py.git@539ea1b3fde70abe6c1c2f5188290e51a577d204",
]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--import-mode=importlib",
]
pythonpath = ["test"]
testpaths = ["test"]

[tool.pdm.scripts]
test = "pytest"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
tidy-sxpb = "sxpb-tidy --ignore-file .gitignore"
tidy = {composite = ["tidy-sxpb"]}
lint = {composite = ["lint-sxpb"]}
tidytest = {composite = ["tidy", "lint", "test"]}
